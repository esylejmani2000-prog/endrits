name: Check

# Runs on every branch except main (main is built by the deploy workflow) and on pull requests.
# The built site is uploaded as an artifact so a branch can be previewed without touching endrits.com.
on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 14
